[project]
name = "mce"
version = "0.1.0"
description = "Market Condition Explorer PoC — 暗号資産市場データの個人研究環境"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "duckdb>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
